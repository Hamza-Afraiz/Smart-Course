# Pin the project name so containers/volumes stay stable regardless of which
# directory compose is invoked from (the file lives in backend/ now).
name: smart-course

services:

  # ─── Core (always on) ────────────────────────────────────────────────────────

  postgres:
    # pgvector/pgvector:pg15 = upstream Postgres 15 + pgvector extension
    # pre-compiled. Same data format as postgres:15-alpine, so the existing
    # `postgres_data` volume mounts cleanly.
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"    # AMQP — Celery connects here
      - "15672:15672"  # Management UI — http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Temporal (workflow engine) — core since Week 2 ─────────────────────────

  temporal:
    image: temporalio/auto-setup:1.24
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"  # Temporal gRPC frontend
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.26.2
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8080:8080"  # Temporal Web UI — http://localhost:8080
    restart: unless-stopped

  # ─── MongoDB — raw event log (the `events` collection) ──────────────────────
  # PostgreSQL is still the source of truth for users / courses / enrollments
  # / progress / certificates (+ chunks & embeddings later via pgvector).
  # Mongo holds the high-volume, append-only event log the analytics layer
  # queries. Storage decision recorded in docs/QA.md.

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1.0.2
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    ports:
      - "8082:8081"  # Mongo UI — http://localhost:8082
    restart: unless-stopped

  # ─── Object storage — MinIO (S3-compatible). Holds uploaded video/pdf. ──────
  # In production this is replaced by Cloudflare R2 / AWS S3 — code unchanged,
  # only the S3_* env vars differ.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"  # S3 API — presigned URLs target this from the browser
      - "9001:9001"  # MinIO console UI — http://localhost:9001 (creds from .env)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── LLM — Ollama (local, free). Powers the Week 5 RAG assistant. ───────────
  # In prod this is swapped for a managed LLM API (OpenAI/Anthropic) — the
  # llm_service client call is the only thing that changes.
  ollama:
    image: ollama/ollama:0.4.7
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"  # Ollama API
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: pull the model into Ollama's volume on first boot (~2GB download).
  # Exits when done; the model persists in ollama_data for subsequent runs.
  ollama-pull:
    image: ollama/ollama:0.4.7
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull llama3.2:1b"]
    restart: "no"

  # ─── Observability — Prometheus (metrics) + Grafana (dashboards) ────────────

  # blackbox-exporter probes endpoints that don't expose Prometheus metrics
  # (Ollama via HTTP, infra via TCP) → exports probe_success for alerting.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"  # http://localhost:9090
    restart: unless-stopped

  # Jaeger — distributed tracing backend + UI. Accepts spans over OTLP
  # (gRPC :4317, HTTP :4318) and renders the per-request waterfall at :16686.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI — http://localhost:16686
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
    restart: unless-stopped

  # Loki — log store. Runs single-binary on its built-in default config.
  loki:
    image: grafana/loki:3.2.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped

  # Promtail — tails every container's stdout via the Docker socket and ships
  # the JSON log lines to Loki. The log shipper half of the logs pillar.
  promtail:
    image: grafana/promtail:3.2.0
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"  # http://localhost:3000  (login admin/admin)
    restart: unless-stopped

  # ─── App containers — API + Temporal worker (one image, three roles) ────────
  # Built from ./Dockerfile. The whole stack comes up with:
  #   docker-compose up -d --build
  # Inside the compose network, services reach each other by name (postgres,
  # redis, rabbitmq, temporal) — that's why DATABASE_URL / TEMPORAL_HOST are
  # overridden here, away from the localhost values in .env used for host runs.

  # one-shot: applies Alembic migrations, then exits. api + worker wait on it.
  # This is also the single build anchor — it's the common dependency of both
  # api and worker, so building it once produces the shared `smart-course-app`
  # image (api/worker just reference it; no parallel-build race on the tag).
  migrate:
    image: smart-course-app
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: smart-course-app   # built by the `migrate` service above
    # --reload + the ./app bind mount below = edit on host, container reloads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TEMPORAL_HOST: temporal:7233
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: smartcourse
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      RAG_TOP_K: 3
      RAG_MIN_SIMILARITY: 0.25
      RAG_MAX_CHUNK_TOKENS: 200
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    image: smart-course-app   # built by the `migrate` service above
    # watchfiles (ships with uvicorn[standard]) gives the worker hot-reload too
    command: ["watchfiles", "python -m app.workers.temporal_worker", "app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEMPORAL_HOST: temporal:7233
      # emit_course_published_activity publishes directly to Kafka — bypasses the outbox
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ─── Kafka (event streaming) — core since Week 3 ────────────────────────────

  kafka:
    # Bitnami removed `bitnami/kafka:*` from Docker Hub mid-2025;
    # `bitnamilegacy/*` is the same image under the new public path.
    image: bitnamilegacy/kafka:3.6
    environment:
      # KRaft mode — no ZooKeeper needed
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Topics are created on first publish — fine for our small set of events
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9094:9094"  # External access from host machine
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: smartcourse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8081:8080"  # Kafka UI — http://localhost:8081
    restart: unless-stopped

  # outbox relay — drains the Postgres `outbox` table into Kafka. Same image
  # as api/worker; just a different command. Long-running poller.
  relay:
    image: smart-course-app   # built by the `migrate` service above
    # watchfiles gives the relay hot-reload during dev, same as the worker
    command: ["watchfiles", "python -m app.workers.outbox_relay", "app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Kafka → Celery bridge for `events.user.enrolled`. One process per consumer
  # group: dedupes via `processed_events`, enqueues the welcome-email task.
  welcome-email-consumer:
    image: smart-course-app
    command: ["watchfiles", "python -m app.workers.welcome_email_consumer", "app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # Universal Kafka consumer — writes every event from every `events.*` topic
  # into MongoDB's `events` collection. The raw interaction log the analytics
  # layer queries. Uses the same dedupe + upsert pattern as welcome-email,
  # plus a unique-index on event_key for belt-and-suspenders idempotency.
  events-archiver:
    image: smart-course-app
    command: ["watchfiles", "python -m app.workers.events_archiver", "app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: smartcourse
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # Celery worker — executes side-effect tasks (welcome email today,
  # analytics rollups and notifications later). One image, many task types.
  celery-worker:
    image: smart-course-app
    # `--without-gossip --without-mingle` cut chatter for a single-replica dev setup
    command: ["watchfiles", "celery -A app.workers.celery_app worker --loglevel=info --without-gossip --without-mingle", "app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  kafka_data:
  mongo_data:
  minio_data:
  ollama_data:
  prometheus_data:
  grafana_data:
