apiVersion: 1

# Grafana-managed alert rules, provisioned on startup. They evaluate Prometheus
# on a timer and flip to Firing in Grafana → Alerting when the condition holds.
# (Contact points aren't provisioned — "panel only": you watch them fire in the
# Grafana Alerting UI. Add a Slack/email contact point later to get notified.)
groups:
  - orgId: 1
    name: smartcourse
    folder: SmartCourse
    interval: 30s
    rules:
      # ── A SmartCourse service is down ─────────────────────────────────────
      # `up` is 1 when Prometheus can scrape a target, 0 when it can't. If any
      # job's latest up == 0 for 1 minute, fire. Stopping any worker trips this.
      - uid: smartcourse-service-down
        title: SmartCourse service is down
        condition: C
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "A SmartCourse service is DOWN (Prometheus can't scrape it)."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'up{job=~"smartcourse-api|relay|welcome-email-consumer|events-archiver|temporal-worker|celery-worker"}'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
              refId: C

      # ── A dependency is down (blackbox probe failed) ──────────────────────
      # Covers Ollama (HTTP) + infra (TCP): postgres, redis, rabbitmq, kafka,
      # mongo, temporal, minio. probe_success == 0 for 1m fires, labelled with
      # the `instance` (which dependency). This is what makes UC4 alertable.
      - uid: smartcourse-dependency-down
        title: SmartCourse dependency is down
        condition: C
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "A SmartCourse dependency probe is failing (see instance label)."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'probe_success'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
              refId: C

      # ── API 5xx error rate elevated ───────────────────────────────────────
      - uid: smartcourse-api-errors
        title: SmartCourse API 5xx error rate elevated
        condition: C
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "API is returning 5xx errors above threshold."
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: 'sum(rate(http_requests_total{status=~"5.."}[5m]))'
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.2] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
              refId: C
