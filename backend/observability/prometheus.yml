global:
  scrape_interval:     10s
  evaluation_interval: 15s

scrape_configs:
  # The SmartCourse API exposes /metrics via prometheus-fastapi-instrumentator.
  # It carries both the auto HTTP metrics and the custom business counters
  # defined in app/observability/metrics.py.
  - job_name: smartcourse-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  # Prometheus scrapes its own /metrics — useful for "is Prometheus healthy?"
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
