# Celery worker — executes side-effect tasks (welcome email; analytics/notifs later).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartcourse-celery-worker
  namespace: smartcourse
  labels: { app: smartcourse-celery-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: smartcourse-celery-worker }
  template:
    metadata:
      labels: { app: smartcourse-celery-worker }
    spec:
      containers:
        - name: celery-worker
          image: REGISTRY/smart-course-app:TAG
          command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef: { name: smartcourse-config }
            - secretRef:    { name: smartcourse-secrets }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
