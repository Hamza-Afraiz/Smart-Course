# Universal Kafka consumer — archives every events.* message into MongoDB.
# Its own consumer group, so it sees every event independently of other consumers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartcourse-events-archiver
  namespace: smartcourse
  labels: { app: smartcourse-events-archiver }
spec:
  replicas: 2
  selector:
    matchLabels: { app: smartcourse-events-archiver }
  template:
    metadata:
      labels: { app: smartcourse-events-archiver }
    spec:
      containers:
        - name: archiver
          image: REGISTRY/smart-course-app:TAG
          command: ["python", "-m", "app.workers.events_archiver"]
          envFrom:
            - configMapRef: { name: smartcourse-config }
            - secretRef:    { name: smartcourse-secrets }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
