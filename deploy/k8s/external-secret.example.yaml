# Where managed-service connection strings live in production — and how they
# reach the pods WITHOUT ever being committed to git or typed into a manifest.
#
# THE FLOW:
#   AWS Secrets Manager   (source of truth — AWS stores/rotates the values)
#         │
#         │  External Secrets Operator (ESO) polls + syncs
#         ▼
#   k8s Secret `smartcourse-secrets`   (created automatically in-cluster)
#         │
#         │  envFrom: secretRef
#         ▼
#   our pods (api / worker / relay / consumers / celery)
#
# So YES — even though AWS runs RDS/MSK/etc., WE still store their endpoints +
# credentials. They live in AWS Secrets Manager (one secret per environment),
# and ESO turns them into the k8s Secret the Deployments already consume. The
# `secret.example.yaml` template is replaced by this generated Secret in prod.
#
# Install ESO once per cluster: https://external-secrets.io

# 1. SecretStore — tells ESO how to authenticate to AWS Secrets Manager.
#    Auth itself uses IRSA (IAM Role for Service Account) — no AWS keys stored.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: smartcourse
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: smartcourse-eso   # k8s SA annotated with an IAM role (IRSA)
---
# 2. ExternalSecret — maps Secrets Manager keys → the k8s Secret keys our pods
#    expect. Edit `remoteRef.key` to your actual Secrets Manager secret names.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: smartcourse-secrets
  namespace: smartcourse
spec:
  refreshInterval: 1h               # ESO re-reads AWS this often (picks up rotation)
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: smartcourse-secrets       # the k8s Secret the Deployments envFrom
    creationPolicy: Owner
  data:
    - secretKey: SECRET_KEY
      remoteRef: { key: smartcourse/prod/app, property: secret_key }
    - secretKey: DATABASE_URL
      remoteRef: { key: smartcourse/prod/rds, property: dsn }            # RDS endpoint + creds
    - secretKey: REDIS_URL
      remoteRef: { key: smartcourse/prod/elasticache, property: url }    # ElastiCache
    - secretKey: RABBITMQ_URL
      remoteRef: { key: smartcourse/prod/amazonmq, property: amqps_url } # Amazon MQ
    - secretKey: CELERY_BROKER_URL
      remoteRef: { key: smartcourse/prod/amazonmq, property: amqps_url }
    - secretKey: CELERY_RESULT_BACKEND
      remoteRef: { key: smartcourse/prod/elasticache, property: result_url }
    - secretKey: MONGO_URL
      remoteRef: { key: smartcourse/prod/documentdb, property: srv_url } # DocumentDB / Atlas
    - secretKey: S3_ACCESS_KEY
      remoteRef: { key: smartcourse/prod/s3, property: access_key }      # S3 / R2
    - secretKey: S3_SECRET_KEY
      remoteRef: { key: smartcourse/prod/s3, property: secret_key }
