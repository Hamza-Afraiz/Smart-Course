    name: smartcourse-welcome-email-consumer
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smartcourse-events-archiver
  namespace: smartcourse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smartcourse-events-archiver
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smartcourse-celery-worker
  namespace: smartcourse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smartcourse-celery-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
