# Temporal worker — runs the course-publishing workflow + activities, which
# include the Week 4 chunking/embedding/Whisper pipeline. CPU + memory heavy
# (torch, sentence-transformers, faster-whisper) → larger limits. In prod this
# pool would ideally sit on GPU nodes; CPU works at lower throughput.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartcourse-worker
  namespace: smartcourse
  labels: { app: smartcourse-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app: smartcourse-worker }
  template:
    metadata:
      labels: { app: smartcourse-worker }
    spec:
      containers:
        - name: worker
          image: REGISTRY/smart-course-app:TAG
          command: ["python", "-m", "app.workers.temporal_worker"]
          envFrom:
            - configMapRef: { name: smartcourse-config }
            - secretRef:    { name: smartcourse-secrets }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "3Gi" }
